name: Apply verification reorder buffer

on:
  push:
    branches:
      - assistant/verification-reorder-buffer
    paths:
      - .github/workflows/apply-verification-reorder-buffer.yml

permissions:
  contents: write

concurrency:
  group: apply-verification-reorder-buffer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out assistant branch
        uses: actions/checkout@v4
        with:
          ref: assistant/verification-reorder-buffer
          fetch-depth: 0

      - name: Apply and verify bounded verification window
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly PATCH=/tmp/verification-reorder-buffer.patch
          readonly WORKFLOW=.github/workflows/apply-verification-reorder-buffer.yml

          test "$(git hash-object solver/index_shard.c)" = \
            80412b5d9c2618b7b352bd1e2cb017e2353c9099
          test "$(git hash-object solver/index_shard_internal.h)" = \
            3d82150adbad4b09746c6529e004ca1e1bdb1c35
          test "$(git hash-object solver/solver.c)" = \
            bc6b4be65e57d5a89222cb4a77c95e5375d92584
          test "$(git hash-object solver/test-index-shard-staged.c)" = \
            751633284f42a7783eddd68bd9996b4d142dc500

          cat .verification-reorder-buffer/patch/part-* > "$PATCH"
          printf '%s  %s\n' \
            cc7af7d692b0b75b2d5dcc7e85a909bc02052a99de32a6b44d05c2766580abf5 \
            "$PATCH" | sha256sum -c -

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

          test "$(git hash-object solver/index_shard.c)" = \
            778d8ca2c85fe67feaa542be2c5c106ccfa73eaf
          test "$(git hash-object solver/index_shard_internal.h)" = \
            5d6580d6672b5f48df256564754aea04625b52e5
          test "$(git hash-object solver/solver.c)" = \
            183f4ec0da4e415fab2cabe728d8ec8ddaf196d0
          test "$(git hash-object solver/test-index-shard-staged.c)" = \
            82a9bf005f8cbfe8b146757979ddc1861952adaf

          rm -rf .verification-reorder-buffer
          rm -f "$WORKFLOW"
          rmdir .github/workflows .github 2>/dev/null || true

          git add -A
          cat > /tmp/expected-paths <<'PATHS'
          .github/workflows/apply-verification-reorder-buffer.yml
          .verification-reorder-buffer/patch/part-00
          .verification-reorder-buffer/patch/part-01
          .verification-reorder-buffer/patch/part-02
          .verification-reorder-buffer/patch/part-03
          .verification-reorder-buffer/patch/part-04
          solver/index_shard.c
          solver/index_shard_internal.h
          solver/solver.c
          solver/test-index-shard-staged.c
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual-paths
          LC_ALL=C sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          git config user.name "OpenAI Engineering Assistant"
          git config user.email "assistant@openai.invalid"
          git commit -m "solver: parallelize bounded verification score windows"
          git push origin HEAD:refs/heads/assistant/verification-reorder-buffer
